<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="lb-version" content="2026.0924-47c98e">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05020f">
<meta name="description" content="LaserBeam - cyber physics puzzle: blast neon blocks off their pedestals with a laser. 1000 stages.">
<title>LaserBeam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=e464348f">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="icon-btn" aria-label="Pause" data-i18n-aria="aria.pause"><span class="pause-ico"></span></button>
      <div class="hud-stage">
        <div id="hudStage">STAGE 1</div>
        <div id="hudSector">NEON CITY</div>
      </div>
      <div class="hud-score"><div class="lbl">SCORE</div><div id="hudScore">0</div></div>
      <div id="hudLaser" class="hud-laser">
        <svg viewBox="0 0 24 24" class="bolt"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        <span id="hudLaserN">0</span>
      </div>
    </div>
    <div class="hud-progress">
      <div class="bar"><div id="hudBar"></div></div>
      <span id="hudTargets">0 / 0</span>
    </div>
    <div id="hudHull" class="hud-hull hidden">
      <span class="lbl">HULL</span>
      <div class="bar"><div id="hullBar"></div><div id="shieldBar"></div></div>
      <span id="hullN">100</span>
    </div>
  </div>

  <div id="dmgFlash"></div>
  <div id="pops"></div>
  <div id="reticle"><i></i><i></i><i></i><i></i></div>
  <div id="banner" class="banner"></div>
  <div id="combo" class="combo"></div>

  <!-- TITLE -->
  <section id="scrTitle" class="screen">
    <div class="title-wrap">
      <div class="logo-top">CYBER DESTRUCTION PUZZLE</div>
      <h1 class="logo" data-text="LaserBeam">LaserBeam</h1>
      <div class="logo-line"></div>
      <div class="logo-sub">1000 STAGES</div>
    </div>
    <div class="title-menu">
      <button id="btnStart" class="neon-btn big">START</button>
      <button id="btnSelect" class="neon-btn">STAGE SELECT</button>
      <button id="btnShop" class="neon-btn gold">LASER SHOP</button>
      <button id="btnSettings" class="neon-btn ghost">SETTINGS</button>
    </div>
    <div class="title-foot" data-i18n="title.foot">TAP TO FIRE</div>
    <button id="btnLang" class="lang-btn" aria-label="Language" data-i18n-aria="aria.lang">🌐</button>
  </section>

  <!-- STAGE SELECT -->
  <section id="scrSelect" class="screen hidden">
    <header class="sel-head">
      <button id="btnSelBack" class="icon-btn" aria-label="Back" data-i18n-aria="aria.back">&#x276E;</button>
      <div class="sel-title">STAGE SELECT</div>
      <div id="selTotal" class="sel-total">★ 0 / 3000</div>
      <button id="btnSelShop" class="icon-btn" aria-label="Shop" data-i18n-aria="aria.shop">🛒</button>
    </header>
    <div id="sectorStrip" class="sector-strip"></div>
    <div id="sectorInfo" class="sector-info"></div>
    <div id="stageGrid" class="stage-grid"></div>
  </section>

  <!-- SHOP -->
  <section id="scrShop" class="screen hidden">
    <header class="sel-head">
      <button id="btnShopBack" class="icon-btn" aria-label="Back" data-i18n-aria="aria.back">&#x276E;</button>
      <div class="sel-title">LASER SHOP</div>
      <div id="shopPt" class="pt-badge">0 PT</div>
    </header>
    <div id="loadout" class="loadout"></div>
    <div id="shopTabs" class="shop-tabs"></div>
    <div id="shopList" class="shop-list"></div>
  </section>
  <div id="toast" class="toast"></div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div id="modalCard" class="modal-card"></div>
  </div>
</div>

<script type="importmap">{
 "imports": {
  "./js/audio.js": "./js/audio.js?v=66c1fbe4",
  "./js/budget3d.js": "./js/budget3d.js?v=11af5cdd",
  "./js/core3d.js": "./js/core3d.js?v=74d51907",
  "./js/enemies.js": "./js/enemies.js?v=84c75c04",
  "./js/gear.js": "./js/gear.js?v=590f27b9",
  "./js/i18n.js": "./js/i18n.js?v=2d4d84a5",
  "./js/main3d.js": "./js/main3d.js?v=acca5008",
  "./js/render3d.js": "./js/render3d.js?v=95f0d7ef",
  "./js/shop.js": "./js/shop.js?v=dbe81916",
  "./lib/addons/postprocessing/EffectComposer.js": "./lib/addons/postprocessing/EffectComposer.js?v=eccf8177",
  "./lib/addons/postprocessing/MaskPass.js": "./lib/addons/postprocessing/MaskPass.js?v=10b721db",
  "./lib/addons/postprocessing/OutputPass.js": "./lib/addons/postprocessing/OutputPass.js?v=8ca54f44",
  "./lib/addons/postprocessing/Pass.js": "./lib/addons/postprocessing/Pass.js?v=a5ec37ce",
  "./lib/addons/postprocessing/RenderPass.js": "./lib/addons/postprocessing/RenderPass.js?v=89aaff34",
  "./lib/addons/postprocessing/ShaderPass.js": "./lib/addons/postprocessing/ShaderPass.js?v=f145da64",
  "./lib/addons/postprocessing/UnrealBloomPass.js": "./lib/addons/postprocessing/UnrealBloomPass.js?v=a60d7378",
  "./lib/addons/shaders/CopyShader.js": "./lib/addons/shaders/CopyShader.js?v=6088e45f",
  "./lib/addons/shaders/LuminosityHighPassShader.js": "./lib/addons/shaders/LuminosityHighPassShader.js?v=05b8a6dd",
  "./lib/addons/shaders/OutputShader.js": "./lib/addons/shaders/OutputShader.js?v=251fcfe4",
  "./lib/cannon-es.js": "./lib/cannon-es.js?v=3248d4f4",
  "./lib/three.module.min.js": "./lib/three.module.min.js?v=4d8e72af",
  "three": "./lib/three.module.min.js?v=4d8e72af"
 }
}</script>
<script src="js/audio.js?v=66c1fbe4"></script>
<script type="module" src="js/main3d.js?v=acca5008"></script>
</body>
</html>
